name: tests
on:
  pull_request:
    branches: [ai/integration, main]
  push:
    branches: [ai/integration, main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: 構文チェック
        run: for f in app/*.php tests/*.php; do php -l "$f"; done
      - name: テスト
        run: php tests/run.php
