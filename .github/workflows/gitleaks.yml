name: gitleaks
# PR は「この PR が足したコミット」だけを検査し、既存の履歴(ベースライン)と区別する。
# 週1回は全履歴を検査して、取りこぼしを拾う。
on:
  pull_request:
    branches: [ai/integration, main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks を入れる（バージョン固定・チェックサム検証）
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o gl.sum "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" gl.sum | sed 's/ .*/  gl.tgz/' | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: PR のコミット範囲を検査
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OPT=""; [ -f .gitleaks-baseline.json ] && OPT="--baseline-path .gitleaks-baseline.json"
          ./gitleaks git --no-banner --redact=100 --exit-code 1 $OPT --log-opts="${BASE_SHA}..${HEAD_SHA}" .
      - name: 全履歴を検査（定期）
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          OPT=""; [ -f .gitleaks-baseline.json ] && OPT="--baseline-path .gitleaks-baseline.json"
          ./gitleaks git --no-banner --redact=100 --exit-code 1 $OPT .
